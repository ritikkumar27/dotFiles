add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$nodejs\
$python\
$golang\
$rust\
$cmd_duration\
$line_break\
$character
"""

[directory]
truncate_to_repo = false
style = "blue"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[git_branch]
symbol = " "

[cmd_duration]
min_time = 500
format = "[$duration](yellow) "

[docker_context]
symbol = " "
